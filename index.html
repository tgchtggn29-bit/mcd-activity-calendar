<title>麦麦活动日历 · 订阅麦当劳活动</title>
<style>
  :root {
    --mcd-red: #DA291C;
    --mcd-yellow: #FFC72C;
    --mcd-dark: #27251F;
    --bg: #FFF8EF;
    --card: #FFFFFF;
    --text: #33302A;
    --muted: #8A8578;
    --line: #EFE6D8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    background: linear-gradient(135deg, #DA291C 0%, #B71F14 100%);
    color: #fff;
    padding: 40px 20px 64px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "🍔";
    position: absolute;
    right: -10px;
    bottom: -20px;
    font-size: 120px;
    opacity: .15;
  }
  .hero h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .hero .sub { margin-top: 8px; font-size: 14px; opacity: .9; }
  .wrap { max-width: 640px; margin: -40px auto 0; padding: 0 16px 48px; position: relative; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 8px 28px rgba(39,37,31,.06);
    border: 1px solid var(--line);
  }
  .card h2 { font-size: 17px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--mcd-red); color: #fff; border: none; border-radius: 24px;
    padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .08s, opacity .2s; text-decoration: none;
  }
  .btn:hover { opacity: .92; }
  .btn:active { transform: scale(.97); }
  .btn.yellow { background: var(--mcd-yellow); color: var(--mcd-dark); }
  .btn.outline { background: #fff; color: var(--mcd-red); border: 1.5px solid var(--mcd-red); }
  .btn.small { padding: 8px 16px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .sub-url {
    background: #F5EFE4; border: 1px dashed #D8CBB6; border-radius: 10px;
    padding: 12px 14px; font-size: 12.5px; word-break: break-all; color: #6B6457;
    margin: 12px 0; user-select: all;
  }
  .code-box {
    text-align: center; padding: 10px 0;
  }
  .code {
    font-family: "SF Mono", Menlo, monospace; font-size: 20px; font-weight: 700;
    color: var(--mcd-red); letter-spacing: 2px; background: #FFF3F2;
    border-radius: 8px; padding: 8px 16px; display: inline-block; margin: 6px 0;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .row .btn { flex: 1; min-width: 140px; }
  .tip { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .steps { list-style: none; counter-reset: s; margin-top: 12px; }
  .steps li { position: relative; padding-left: 30px; margin: 8px 0; font-size: 14px; }
  .steps li::before {
    counter-increment: s; content: counter(s);
    position: absolute; left: 0; top: 1px; width: 20px; height: 20px;
    background: var(--mcd-yellow); color: var(--mcd-dark); border-radius: 50%;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .event { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .event:last-child { border-bottom: none; }
  .event .title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; background: #FFF3F2; color: var(--mcd-red); border-radius: 4px; padding: 2px 8px; font-weight: 500; }
  .badge.blue { background: #EAF2FF; color: #1A66D8; }
  .event .meta { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  .event .desc { font-size: 13px; color: #5A5448; margin-bottom: 10px; }
  .event .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #map { width: 100%; height: 340px; border-radius: 12px; }
  .store-list { margin-top: 14px; }
  .store { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .store:last-child { border-bottom: none; }
  .store .dot { width: 10px; height: 10px; background: var(--mcd-red); border-radius: 50%; flex-shrink: 0; }
  .store .nm { font-size: 14px; font-weight: 600; }
  .store .ad { font-size: 12px; color: var(--muted); }
  .footer { text-align: center; font-size: 12px; color: var(--muted); padding: 10px 0 30px; }
  .footer a { color: var(--mcd-red); text-decoration: none; }
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(80px);
    background: var(--mcd-dark); color: #fff; padding: 12px 22px; border-radius: 24px;
    font-size: 14px; opacity: 0; transition: all .3s; z-index: 999; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<div class="hero">
  <h1>🍟 麦麦活动日历</h1>

</div>

<div class="wrap">

  <!-- 订阅区 -->

    <ol class="steps">

      <li>复制订阅地址，添加到手机 / 电脑日历</li>
      <li>活动上线、即将截止时，日历自动提醒你</li>
    </ol>
    <div class="code-box" id="codeBox" style="display:none;">

      <div class="code" id="codeShow">—</div>
      <div class="sub-url" id="subUrl"></div>
    </div>
    <div class="row">

      <button class="btn yellow" id="btnCopy" onclick="copySub()" disabled>📋 复制订阅地址</button>

  </div>

  <!-- 活动列表 -->
  <div class="card">
    <h2>🎁 本月活动（<span id="eventCount">0</span>）</h2>
    <div id="eventList"><div class="tip">加载中…</div></div>
  </div>

  <!-- 门店地图 -->
  <div class="card">
    <h2>📍 附近门店</h2>
    <div id="map"></div>
    <div class="store-list" id="storeList"></div>
  </div>

  <!-- 跳转 App -->
  <div class="card">
    <h2>📱 打开麦当劳</h2>
    <div class="row">
      <button class="btn outline" onclick="goApp('app')">打开麦当劳 App</button>
      <button class="btn outline" onclick="goApp('miniprogram')">打开微信小程序</button>
    </div>
    <div class="tip">跳转行为会记入订阅统计，用于分析「订阅 → 到店」转化。</div>
  </div>

  <div class="footer">
    <a href="dashboard.html">📊 查看订阅统计后台</a> · 本项目为参赛作品，非麦当劳官方产品<br>
    餐品信息、价格及供应状态以麦当劳官方渠道实时结果为准

</div>

      publishableKey: 'wbpk_wpdpshm5Z7b5ofnGt1XXZ4_5b3wRitejgMSKR2YVfEvuPbwjqrwkLdQ'
    });
  } catch (e) {
    console.warn('cloud init failed', e);
  }

  /* ---------- 工具 ---------- */
  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* 订阅地址：跟随当前部署目录，不硬编码 */
  var ICS_URL = (function () {
    try { return location.origin + location.pathname.replace(/[^\/]*$/, '') + 'assets/calendar.ics'; }
    catch (e) { return 'assets/calendar.ics'; }
  })();

  /* ---------- 埋点 ---------- */
  function genCode() {
    return 'mcd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }
  var myCode = null;

  function claimCode() {
    var code = genCode();
    myCode = code;
    var ua = navigator.userAgent.slice(0, 200);
    if (cloud) {
      cloud.database.from('subscriptions').insert({ code: code, user_agent: ua, source: 'web' })
        .then(function () {})
        .catch(function (e) { console.warn('claim log failed', e); });
    }
    $('codeShow').textContent = code;
    $('subUrl').textContent = ICS_URL + '?code=' + code;
    $('codeBox').style.display = 'block';
    $('btnCopy').disabled = false;
    toast('订阅码已生成 🎉');
  }

  function copySub() {
    var url = $('subUrl').textContent;
    var done = function () {
      if (cloud && myCode) {
        cloud.database.from('pulls').insert({ code: myCode, user_agent: navigator.userAgent.slice(0, 200) })
          .then(function () {}).catch(function (e) { console.warn('pull log failed', e); });
      }
      toast('订阅地址已复制，去日历里粘贴即可 ✅');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(function () { fallbackCopy(url, done); });
    } else {
      fallbackCopy(url, done);
    }
  }
  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); cb();
  }

  /* 麦当劳官网只有带 www 的域名可达；裸域名 mcdonalds.com.cn 无法解析会「无法打开网址」。
     这里统一纠正领券链接：裸域名→www；/news/ 推文页保留；其他无意义子路径回首页。 */
  var MCD_HOME = 'https://www.mcdonalds.com.cn/';
  function normalizeUrl(u) {
    if (!u) return MCD_HOME;
    u = String(u).trim();
    if (u.indexOf('://') === -1) u = 'https://' + u;
    if (u.indexOf('://mcdonalds.com.cn') !== -1 && u.indexOf('://www.mcdonalds.com.cn') === -1) {
      u = u.replace('://mcdonalds.com.cn', '://www.mcdonalds.com.cn');
    }
    if (u.indexOf('://www.mcdonalds.com.cn') === -1) return MCD_HOME;
    if (u.indexOf('/news/') !== -1) return u;   // 官方推文页，保留
    if (u.replace(/\/+$/, '') !== 'https://www.mcdonalds.com.cn') u = MCD_HOME;
    return u;
  }

  function trackClick(campaignId, link) {
    if (cloud) {
      cloud.database.from('clicks').insert({ code: myCode || null, campaign_id: campaignId })
        .then(function () {}).catch(function (e) { console.warn('click log failed', e); });
    }
    var target = normalizeUrl(link);
    toast('正在打开麦当劳官网…');
    // 直接跳转（location.href 比 window.open 更稳，不会被弹窗拦截）
    setTimeout(function () { window.location.href = target; }, 120);
  }

  function goApp(target) {
    if (cloud) {
      cloud.database.from('redirects').insert({ code: myCode || null, target: target })
        .then(function () {}).catch(function (e) { console.warn('redirect log failed', e); });
    }
    // 统一跳转到麦当劳官网（真实可访问），APP/小程序由官网引导下载或唤起
    window.location.href = 'https://www.mcdonalds.com.cn/';
  }

  /* ---------- 渲染活动 ---------- */
  function renderEvents() {
    var data = JSON.parse($('campaigns-data').textContent || '[]');
    $('eventCount').textContent = data.length;
    var box = $('eventList');
    if (!data.length) { box.innerHTML = '<div class="tip">暂无活动数据</div>'; return; }
    var html = '';
    data.forEach(function (a) {
      var span = a.start_date + (a.end_date && a.end_date !== a.start_date ? ' 至 ' + a.end_date : '');
      html += '<div class="event">'
        + '<div class="title">' + esc(a.title)
        + '<span class="badge">' + esc(a.type || '活动') + '</span>'
        + '<span class="badge blue">' + esc(a.region || '全国') + '</span></div>'
        + '<div class="meta">🗓 ' + esc(span) + '</div>'
        + '<div class="desc">' + esc(a.description || '') + '</div>'
        + '<div class="actions">'
        + '<button class="btn small" onclick="trackClick(\'' + a.id + '\',\'' + esc(a.coupon_link || '') + '\')">🎟️ 领取优惠券</button>'
        + '</div></div>';
    });
    box.innerHTML = html;
  }

  /* ---------- 渲染门店 + 地图 ---------- */
  function renderStores() {
    var stores = JSON.parse($('stores-data').textContent || '[]');
    var list = $('storeList');
    var html = '';
    stores.forEach(function (s) {
      html += '<div class="store"><span class="dot"></span>'
        + '<div><div class="nm">' + esc(s.name) + ' · ' + esc(s.distance || '') + '</div>'
        + '<div class="ad">' + esc(s.address || '') + (s.open_hours ? ' · ' + esc(s.open_hours) : '') + '</div></div></div>';
    });
    list.innerHTML = html;
    locateAndInitMap(stores);
  }

  // 第一时间获取用户位置，地图以用户为中心；定位失败才回退到门店中心
  function locateAndInitMap(stores) {
    var mapEl = $('map');
    if (typeof TMap === 'undefined' || !stores.length) {
      mapEl.innerHTML = '<div class="tip">地图加载中或暂无门店数据…</div>';
      return;
    }
    // 定位状态提示条（定位中 / 已定位 / 定位失败可重试）
    var statusEl = document.createElement('div');
    statusEl.className = 'tip';
    statusEl.id = 'locateStatus';
    statusEl.style.marginBottom = '8px';
    mapEl.parentNode.insertBefore(statusEl, mapEl);

    function setStatus(html) { if ($('locateStatus')) $('locateStatus').innerHTML = html; }
    setStatus('📍 正在获取你的位置，地图将以你为中心…');

    function tryLocate() {
      if (!navigator.geolocation) {
        setStatus('⚠️ 当前浏览器不支持定位，已显示默认门店');
        initMap(stores, null);
        return;
      }
      setStatus('📍 正在获取你的位置，地图将以你为中心…');
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          setStatus('✅ 已定位到你的位置（蓝色圆点），门店已按距离排序');
          initMap(stores, { lat: pos.coords.latitude, lng: pos.coords.longitude });
        },
        function (err) {
          var msg = '⚠️ 定位未授权或失败，已按默认门店显示';
          if (err && err.code === 1) msg = '⚠️ 定位被拒绝，点击 <a href="javascript:;" onclick="retryLocate()" style="color:#1A66D8">重新定位</a> 授权';
          else if (err && err.code === 3) msg = '⚠️ 定位超时，点击 <a href="javascript:;" onclick="retryLocate()" style="color:#1A66D8">重试</a>';
          setStatus(msg);
          initMap(stores, null);
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
      );
    }
    window.retryLocate = tryLocate;
    tryLocate();
  }

  function initMap(stores, userPos) {
    // 用户位置优先作地图中心，并按距离重排门店
    var center, userLoc = null;
    if (userPos) {
      userLoc = { lat: userPos.lat, lng: userPos.lng };
      center = new TMap.LatLng(userPos.lat, userPos.lng);
      var _sorted = stores.slice().sort(function (a, b) {
        return dist(userLoc, a) - dist(userLoc, b);
      });
      stores = _sorted;
    } else {
      center = new TMap.LatLng(stores[0].lat, stores[0].lng);
    }
    var map = new TMap.Map('map', { zoom: 13, center: center });

    function dist(p, s) {
      var dx = (s.lat - p.lat) * 111.0;
      var dy = (s.lng - p.lng) * 111.0 * Math.cos(p.lat * Math.PI / 180);
      return Math.sqrt(dx * dx + dy * dy);
    }

    // 自定义 marker 图标（内联 SVG，不引用官方 demo 图片）
    var pin = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="38">'
      + '<path d="M15 0C6.7 0 0 6.7 0 15c0 11.3 15 23 15 23s15-11.7 15-23C30 6.7 23.3 0 15 0z" fill="#DA291C"/>'
      + '<circle cx="15" cy="14" r="6" fill="#FFC72C"/></svg>'
    );
    var geometries = stores.map(function (s, i) {
      return { id: s.id, styleId: 'default', position: new TMap.LatLng(s.lat, s.lng) };
    });
    // 用户当前位置：蓝色圆点标记（内联 SVG）
    var meIcon = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">'
      + '<circle cx="10" cy="10" r="8" fill="#1A66D8" stroke="#fff" stroke-width="2"/>'
      + '<circle cx="10" cy="10" r="3" fill="#fff"/></svg>'
    );
    if (userLoc) {
      geometries.push({ id: '__me__', styleId: 'me', position: new TMap.LatLng(userLoc.lat, userLoc.lng) });
    }
    var markerLayer = new TMap.MultiMarker({
      map: map,
      styles: {
        default: new TMap.MarkerStyle({ width: 30, height: 38, anchor: { x: 15, y: 38 } }),
        me: new TMap.MarkerStyle({ width: 20, height: 20, anchor: { x: 10, y: 10 }, src: meIcon })
      },
      geometries: geometries
    });
    var infoWin = new TMap.InfoWindow({ map: map, position: new TMap.LatLng(0, 0), offset: { x: 0, y: -40 } });
    markerLayer.on('click', function (e) {
      if (e.geometry.id === '__me__') return;   // 用户位置点不弹信息窗
      var s = stores.filter(function (x) { return x.id === e.geometry.id; })[0];
      if (!s) return;
      infoWin.setPosition(e.geometry.position);
      infoWin.setContent('<div style="padding:4px;font-size:13px;line-height:1.5"><b>' + esc(s.name) + '</b><br>'
        + esc(s.address || '') + '</div>');
      infoWin.open();
    });
  }

  /* ---------- 启动 ---------- */
  window.claimCode = claimCode;
  window.copySub = copySub;
  window.trackClick = trackClick;
  window.goApp = goApp;

  document.addEventListener('DOMContentLoaded', function () {
    renderEvents();
    renderStores();
  });
})();
</script>
</body>
</html>
